name: Eval — Matching Precision/Recall (週次)

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/eval/package.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts/eval

      - name: Run evaluation
        run: npm run eval
        working-directory: scripts/eval
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GIT_SHA: ${{ github.sha }}

      - name: Post summary to job log
        if: always()
        run: |
          echo "::notice::評価が完了しました。Supabase eval_runs テーブルで結果を確認してください。"
